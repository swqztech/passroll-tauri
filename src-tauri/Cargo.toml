[package]
name = "passroll_tauri"
version = "1.0.0"
description = "随密"
authors = ["codes"]
edition = "2021"

[lib]
name = "passroll_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
